<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JOTO AI 前台伴侣</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><strong>JOTO AI 前台伴侣</strong><span>登录凭证始终留在当前浏览器 Profile</span></header>
    <section>
      <label for="pairing-code">一次性设备配对码</label>
      <div class="row"><input id="pairing-code" autocomplete="off" maxlength="20" placeholder="输入工作台生成的配对码"><button id="pair-device">配对</button></div>
    </section>
    <section>
      <label for="platform">绑定 AI 账号</label>
      <select id="platform">
        <option value="chatgpt">ChatGPT</option>
        <option value="doubao">豆包</option>
        <option value="deepseek">DeepSeek</option>
        <option value="qwen">千问</option>
      </select>
      <input id="account-alias" maxlength="120" placeholder="例如：中立测试账号">
      <label class="check"><input id="dedicated-account" type="checkbox" checked>这是专用中立 AI 账号；平台记忆/历史引用已关闭，且没有自定义指令</label>
      <button id="bind-account" class="primary">打开登录页并绑定</button>
      <small>账号还应没有既往 JOTO 问答或研究历史。Chrome Profile 不能清除服务端记忆；任一条件不成立，请取消勾选，结果只会作为个性化样本。</small>
    </section>
    <button id="poll-now" class="secondary">立即检查待执行任务</button>
    <output id="status" role="status">等待操作</output>
  </main>
  <script src="popup.js"></script>
</body>
</html>
