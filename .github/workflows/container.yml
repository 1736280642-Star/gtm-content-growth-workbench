name: container

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate:structure
      - run: docker build --target web -t joto-gtm-workbench-web:ci .
      - run: docker build --target worker -t joto-gtm-workbench-worker:ci .
      - name: Validate Compose
        env:
          MYSQL_PASSWORD: ci-not-a-real-secret
          MYSQL_ROOT_PASSWORD: ci-not-a-real-secret-root
        run: docker compose --profile full config --quiet
