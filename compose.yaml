  RAG_OPENSEARCH_BULK_SIZE: ${RAG_OPENSEARCH_BULK_SIZE:-100}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
  QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}
  QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
  DOUBAO_MODEL: ${DOUBAO_MODEL:-}
  DOUBAO_BASE_URL: ${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  V5_FORMAL_ARTICLE_PROVIDER: ${V5_FORMAL_ARTICLE_PROVIDER:-qwen}
  V5_SAMPLE_ARTICLE_PROVIDER: ${V5_SAMPLE_ARTICLE_PROVIDER:-qwen}
  CONTENT_GENERATION_PROVIDER: ${CONTENT_GENERATION_PROVIDER:-qwen}
  ARTICLE_TYPE_AI_PROVIDER: ${ARTICLE_TYPE_AI_PROVIDER:-qwen}
  EMBEDDING_PROVIDER_TIMEOUT_MS: ${EMBEDDING_PROVIDER_TIMEOUT_MS:-60000}
  AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-120000}
  AI_PROVIDER_PREFLIGHT_TIMEOUT_MS: ${AI_PROVIDER_PREFLIGHT_TIMEOUT_MS:-8000}
  AI_PROVIDER_FORMAL_TIMEOUT_MS: ${AI_PROVIDER_FORMAL_TIMEOUT_MS:-180000}
  AI_PROVIDER_FORMAL_DEADLINE_MS: ${AI_PROVIDER_FORMAL_DEADLINE_MS:-360000}
  AI_PROVIDER_FORMAL_MAX_CALLS: ${AI_PROVIDER_FORMAL_MAX_CALLS:-3}
  AI_PROVIDER_FORMAL_MAX_ATTEMPTS_PER_ROUND: ${AI_PROVIDER_FORMAL_MAX_ATTEMPTS_PER_ROUND:-2}
  GEO_RESEARCH_ZHIPU_API_KEY: ${GEO_RESEARCH_ZHIPU_API_KEY:-}
  GEO_RESEARCH_ZHIPU_MODEL: ${GEO_RESEARCH_ZHIPU_MODEL:-glm-4-air}
  GEO_RESEARCH_ZHIPU_BASE_URL: ${GEO_RESEARCH_ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
  GEO_RESEARCH_ZHIPU_SEARCH_ENGINE: ${GEO_RESEARCH_ZHIPU_SEARCH_ENGINE:-search_pro}
  GEO_RESEARCH_ZHIPU_SEARCH_COUNT: ${GEO_RESEARCH_ZHIPU_SEARCH_COUNT:-10}
  GEO_RESEARCH_ZHIPU_SEARCH_RECENCY: ${GEO_RESEARCH_ZHIPU_SEARCH_RECENCY:-noLimit}
  GEO_RESEARCH_ZHIPU_CONTENT_SIZE: ${GEO_RESEARCH_ZHIPU_CONTENT_SIZE:-high}
  GEO_RESEARCH_ZHIPU_MAX_QUERIES: ${GEO_RESEARCH_ZHIPU_MAX_QUERIES:-3}
  GEO_RESEARCH_DOUBAO_API_KEY: ${GEO_RESEARCH_DOUBAO_API_KEY:-}
  GEO_RESEARCH_DOUBAO_MODEL: ${GEO_RESEARCH_DOUBAO_MODEL:-}
  GEO_RESEARCH_DOUBAO_BASE_URL: ${GEO_RESEARCH_DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
  GEO_RESEARCH_QWEN_API_KEY: ${GEO_RESEARCH_QWEN_API_KEY:-}
  GEO_RESEARCH_QWEN_MODEL: ${GEO_RESEARCH_QWEN_MODEL:-}
  GEO_RESEARCH_QWEN_BASE_URL: ${GEO_RESEARCH_QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  GEO_CHANNEL_RULE_PACK_PATH: ${GEO_CHANNEL_RULE_PACK_PATH:-/app/config/geo-channel-rule-pack.json}
  RAG_IMPORT_ACTOR_ID: ${RAG_IMPORT_ACTOR_ID:-docker-rag-source-import}
  RAG_IMPORT_ACTOR_ROLE: ${RAG_IMPORT_ACTOR_ROLE:-knowledge_production_worker}
  RAG_IMPORT_ACTOR_TYPE: system
  RAG_IMPORT_AUDIT_REASON: ${RAG_IMPORT_AUDIT_REASON:-Scheduled source import in the local production distribution.}
  KNOWLEDGE_COLLECTION_ACTOR_ID: ${KNOWLEDGE_COLLECTION_ACTOR_ID:-docker-knowledge-collection}
  KNOWLEDGE_COLLECTION_ACTOR_ROLE: ${KNOWLEDGE_COLLECTION_ACTOR_ROLE:-knowledge_collection_scheduler}
  KNOWLEDGE_COLLECTION_AI_PROVIDER: ${KNOWLEDGE_COLLECTION_AI_PROVIDER:-qwen}
  # This distribution is bound to 127.0.0.1 and uses a deployment-owned actor;
  # request bodies can no longer choose their own identity in production.
  V5_TRUSTED_SERVER_WRITES_ENABLED: ${V5_TRUSTED_SERVER_WRITES_ENABLED:-true}
  V5_TRUSTED_SERVER_ACTOR_ID: ${V5_TRUSTED_SERVER_ACTOR_ID:-local-docker-operator}
  V5_TRUSTED_SERVER_ACTOR_ROLE: ${V5_TRUSTED_SERVER_ACTOR_ROLE:-developer_admin}
  V5_SINGLE_ARTICLE_WRITES_ENABLED: ${V5_SINGLE_ARTICLE_WRITES_ENABLED:-true}
  V5_SINGLE_ARTICLE_ACTOR_ID: ${V5_SINGLE_ARTICLE_ACTOR_ID:-local-docker-operator}
  V5_SINGLE_ARTICLE_ACTOR_ROLE: ${V5_SINGLE_ARTICLE_ACTOR_ROLE:-developer_admin}
  V5_CONTENT_WORKER_BATCH_SIZE: ${V5_CONTENT_WORKER_BATCH_SIZE:-20}
  V5_SAMPLE_WORKER_BATCH_SIZE: ${V5_SAMPLE_WORKER_BATCH_SIZE:-3}
  V5_SAMPLE_WORKER_CONCURRENCY: ${V5_SAMPLE_WORKER_CONCURRENCY:-2}
  V5_CONTENT_WORKER_CONCURRENCY: ${V5_CONTENT_WORKER_CONCURRENCY:-2}
  V5_SAMPLE_OPERATION_STALE_MINUTES: ${V5_SAMPLE_OPERATION_STALE_MINUTES:-20}
  V5_SAMPLE_OPERATION_MAX_ATTEMPTS: ${V5_SAMPLE_OPERATION_MAX_ATTEMPTS:-3}
  GEO_RESEARCH_INTERVAL_SECONDS: ${GEO_RESEARCH_INTERVAL_SECONDS:-60}
  GEO_RESEARCH_ORCHESTRATION_INTERVAL_SECONDS: ${GEO_RESEARCH_ORCHESTRATION_INTERVAL_SECONDS:-300}
  MONTHLY_AUTOMATION_INTERVAL_SECONDS: ${MONTHLY_AUTOMATION_INTERVAL_SECONDS:-60}
  HOSTED_MANAGED_INTERVAL_SECONDS: ${HOSTED_MANAGED_INTERVAL_SECONDS:-60}
  HOSTED_PUBLIC_BASE_URL: ${HOSTED_PUBLIC_BASE_URL:-http://127.0.0.1:3027}
  HOSTED_REVIEW_LINK_SECRET: ${HOSTED_REVIEW_LINK_SECRET:-}
  HOSTED_EMAIL_DELIVERY_URL: ${HOSTED_EMAIL_DELIVERY_URL:-}
  HOSTED_EMAIL_DELIVERY_TOKEN: ${HOSTED_EMAIL_DELIVERY_TOKEN:-}
  HOSTED_EMAIL_SETUP_TOKEN: ${HOSTED_EMAIL_SETUP_TOKEN:-}
  HOSTED_EMAIL_CREDENTIAL_ENCRYPTION_KEY: ${HOSTED_EMAIL_CREDENTIAL_ENCRYPTION_KEY:-}
  HOSTED_EMAIL_OAUTH_REDIRECT_BASE_URL: ${HOSTED_EMAIL_OAUTH_REDIRECT_BASE_URL:-http://127.0.0.1:3027}
  HOSTED_EMAIL_GOOGLE_CLIENT_ID: ${HOSTED_EMAIL_GOOGLE_CLIENT_ID:-}
  HOSTED_EMAIL_GOOGLE_CLIENT_SECRET: ${HOSTED_EMAIL_GOOGLE_CLIENT_SECRET:-}
  HOSTED_EMAIL_MICROSOFT_CLIENT_ID: ${HOSTED_EMAIL_MICROSOFT_CLIENT_ID:-}
  HOSTED_EMAIL_MICROSOFT_CLIENT_SECRET: ${HOSTED_EMAIL_MICROSOFT_CLIENT_SECRET:-}
  HOSTED_DAILY_DIGEST_CUTOFF_HOUR: ${HOSTED_DAILY_DIGEST_CUTOFF_HOUR:-20}
  HOSTED_CAPTURE_SETUP_TOKEN: ${HOSTED_CAPTURE_SETUP_TOKEN:-}
  PUBLISH_DEFAULT_EXECUTOR_TYPE: ${PUBLISH_DEFAULT_EXECUTOR_TYPE:-cloud_browser}
  PUBLISH_EXECUTOR_REGISTRATION_SECRET: ${PUBLISH_EXECUTOR_REGISTRATION_SECRET:-}
  PUBLISH_EXECUTOR_API_BASE_URL: ${PUBLISH_EXECUTOR_API_BASE_URL:-http://workbench-web:3027}
  PUBLISH_EXECUTOR_TYPE: ${PUBLISH_EXECUTOR_TYPE:-cloud_browser}
  PUBLISH_EXECUTOR_CAPACITY: ${PUBLISH_EXECUTOR_CAPACITY:-1}
  PUBLISH_EXECUTOR_STATE_PATH: ${PUBLISH_EXECUTOR_STATE_PATH:-/app/runtime/worker-status/browser-executor-node.json}
  JOTO_PUBLISH_RUNNER_URL: ${JOTO_PUBLISH_RUNNER_URL:-http://host.docker.internal:9530}
  JOTO_PUBLISH_RUNNER_TOKEN: ${JOTO_PUBLISH_RUNNER_TOKEN:-}
  PIPELINE_WORKER_INTERVAL_SECONDS: ${PIPELINE_WORKER_INTERVAL_SECONDS:-3600}
  WECHATSYNC_ENABLED: ${WECHATSYNC_ENABLED:-false}
  WECHATSYNC_MOCK: ${WECHATSYNC_MOCK:-true}
  WECHATSYNC_BRIDGE_URL: ${WECHATSYNC_BRIDGE_URL:-http://host.docker.internal:9528}
  CONTENT_METRICS_RUNNER_URL: http://content-metrics-runner:9531
  CONTENT_METRICS_RUNNER_TOKEN: ${CONTENT_METRICS_RUNNER_TOKEN:-}
  CONTENT_METRICS_INTERVAL_SECONDS: ${CONTENT_METRICS_INTERVAL_SECONDS:-21600}
  SITE_AUDIT_MAX_PAGES: ${SITE_AUDIT_MAX_PAGES:-25}
  SITE_AUDIT_WORKER_INTERVAL_SECONDS: ${SITE_AUDIT_WORKER_INTERVAL_SECONDS:-30}
  SITE_AUDIT_RENDERER_URL: ${SITE_AUDIT_RENDERER_URL:-}
  SITE_AUDIT_RENDERER_TOKEN: ${SITE_AUDIT_RENDERER_TOKEN:-}
  GEO_MONITORING_SCHEDULER_INTERVAL_SECONDS: ${GEO_MONITORING_SCHEDULER_INTERVAL_SECONDS:-3600}

x-app-volumes: &app-volumes
  - workbench_data:/app/data
  - workbench_artifacts:/app/artifacts
  - worker_runtime:/app/runtime/worker-status

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

x-worker: &worker
  build:
    context: .
    target: worker
  image: joto-gtm-workbench-worker:${WORKBENCH_IMAGE_TAG:-0.1.0}
  restart: unless-stopped
  stop_grace_period: 30s
  environment: *app-environment
  volumes: *app-volumes
  logging: *default-logging
  depends_on:
    mysql:
      condition: service_healthy
    opensearch:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4.3
    profiles: [core, full]
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joto_workbench}
      MYSQL_USER: ${MYSQL_USER:-joto}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+08:00"]
    ports:
      - "127.0.0.1:${MYSQL_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  db-init:
    build:
      context: .
      target: worker
    image: joto-gtm-workbench-worker:${WORKBENCH_IMAGE_TAG:-0.1.0}
    profiles: [core, full]
    restart: "no"
    environment: *app-environment
    command: ["node", "scripts/init-mysql-schema.mjs"]
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  workbench-web:
    build:
      context: .
      target: web
    image: joto-gtm-workbench-web:${WORKBENCH_IMAGE_TAG:-0.1.0}
    profiles: [core, full]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env.local
        required: false
        format: raw
    environment:
      <<: *app-environment
      # The web API owns the persisted publish ledger. Keep it on the mounted
      # JSON state unless an operator explicitly selects another web backend.
      WORKBENCH_STORAGE: ${WEB_WORKBENCH_STORAGE:-local_json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-3027}:3027"
    volumes: *app-volumes
    networks:
      - default
      - content_metrics_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3027/api/health?scope=web').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    depends_on:
      db-init:
        condition: service_completed_successfully
    logging: *default-logging

  content-metrics-runner:
    build:
      context: .
      target: worker
    image: joto-gtm-workbench-worker:${WORKBENCH_IMAGE_TAG:-0.1.0}
    profiles: [core, full]
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: .env.local
        required: false
        format: raw
    environment:
      <<: *app-environment
      CONTENT_METRICS_RUNNER_HOST: 0.0.0.0
      CONTENT_METRICS_RUNNER_PORT: 9531
    command: ["node", "scripts/content-metrics-runner.mjs"]
    networks:
      - default
      - content_metrics_private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9531/health').then(async r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    logging: *default-logging

  content-metrics-worker:
    build:
      context: .
      target: worker
    image: joto-gtm-workbench-worker:${WORKBENCH_IMAGE_TAG:-0.1.0}
    profiles: [core, full]
    restart: unless-stopped
    stop_grace_period: 20s
    environment: *app-environment
    command: ["node", "workers/content-metrics-worker.mjs"]
    networks:
      - content_metrics_private
    depends_on:
      workbench-web:
        condition: service_healthy
      content-metrics-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "try{process.kill(1,0)}catch{process.exit(1)}"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging: *default-logging

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: [full]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      path.repo: /usr/share/opensearch/backup
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_EXPOSE_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - opensearch_backups:/usr/share/opensearch/backup
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    logging: *default-logging

  rag-index-worker:
    <<: *worker
    profiles: [full]
    environment:
      <<: *app-environment
      WORKER_ROLE: rag-index-worker
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs", "rag-index-worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  knowledge-worker:
    <<: *worker
    profiles: [full]
    environment:
      <<: *app-environment
      WORKER_ROLE: knowledge-worker
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs", "knowledge-worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  content-worker:
    <<: *worker
    profiles: [full]
    environment:
      <<: *app-environment
      WORKER_ROLE: content-worker
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs", "content-worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  monitor-worker:
    <<: *worker
    profiles: [full]
    environment:
      <<: *app-environment
      WORKER_ROLE: monitor-worker
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs", "monitor-worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      workbench-web:
        condition: service_healthy

  publish-worker:
    <<: *worker
    profiles: [full]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      WORKER_ROLE: publish-worker
    healthcheck:
      test: ["CMD", "node", "scripts/container-healthcheck.mjs", "publish-worker"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      workbench-web:
        condition: service_healthy

  browser-executor-worker:
    <<: *worker
    profiles: [full]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      WORKER_ROLE: browser-executor-worker
    command: ["node", "workers/browser-executor-worker.mjs"]
    depends_on:
      mysql:
        condition: service_healthy
      workbench-web:
        condition: service_healthy

volumes:
  mysql_data:
  opensearch_data:
  opensearch_backups:
  workbench_data:
  workbench_artifacts:
  worker_runtime:

networks:
  default: {}
  content_metrics_private:
    internal: true

